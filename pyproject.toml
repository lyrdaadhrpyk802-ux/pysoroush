[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pysoroush"
version = "0.2.0"
description = "A modern, simple, and powerful Python library for the Soroush Plus messenger."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Ali VEX", email = "lyrdaadhrpyk802@gmail.com" }
]
keywords = ["soroush", "soroush-plus", "bot", "api", "userbot", "messenger"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "rsa>=4.9",
    "pyaes>=1.6.1",
    "requests>=2.28.0",
    "aiohttp>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/lyrdaadhrpyk802-ux/pysoroush"
Repository = "https://github.com/lyrdaadhrpyk802-ux/pysoroush"

[tool.setuptools.packages.find]
include = ["pysoroush*"]
